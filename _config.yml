description: As a mechanical engineering student at California State University of Northridge, I specialize in mechanical design and finite element analysis (FEA). With a Certified SolidWorks Associate (CSWA) credential, I bring a robust technical skill set focused on engineering design optimization and advanced computational modeling.
My projects showcase a comprehensive approach to solving complex engineering challenges, ranging from developing Arduino-based data acquisition systems to conducting intricate FEA simulations on car wheel designs and precision test fixtures. I leverage tools like SolidWorks, Arduino, and C++ to transform theoretical concepts into practical, high-performance engineering solutions that demonstrate both technical precision and creative problem-solving.
